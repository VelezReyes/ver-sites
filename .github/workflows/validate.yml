name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check structure, file sizes and personal data
        run: python scripts/validate.py

      - name: Test-build every area
        run: |
          for area in $(python -c "import json; print(' '.join(json.load(open('areas.json'))['areas']))"); do
            python scripts/build_area.py "$area" "_build/$area"
          done
