name: Publish areas

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      area:
        description: 'Area to republish (folder name), or "all"'
        required: true
        default: all

# One publish at a time, in order, so two merges can't race on the same site repo.
concurrency:
  group: publish-areas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Select areas to publish
        id: select
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          AREA: ${{ inputs.area }}
        run: python scripts/changed_areas.py --base "$BASE" --head "$HEAD" --area "$AREA"

  publish:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Publish ${{ matrix.area }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so the landing page can show "updated" dates

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate
        run: python scripts/validate.py

      - name: Build ${{ matrix.area }}
        run: python scripts/build_area.py "${{ matrix.area }}" "_build/site"

      - name: Get a token for ${{ matrix.repo }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Push to ${{ matrix.repo }}
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ matrix.repo }}
          AREA: ${{ matrix.area }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          set -euo pipefail
          # The site repo is a build output and is public, so it keeps no history:
          # each publish replaces it with one fresh commit. That way, an unpublished
          # page can't be recovered from an older commit. The full history lives in
          # ver-sites, which is private.
          mkdir site && cd site
          git init --quiet
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${OWNER}/${REPO}.git"
          # What's live now, if anything, so an unchanged build doesn't push.
          old_tree=""
          if git fetch --quiet --depth 1 origin main 2>/dev/null; then
            old_tree=$(git rev-parse 'FETCH_HEAD^{tree}')
          fi
          cp -a ../_build/site/. .
          git add -A
          if [ "$(git write-tree)" = "$old_tree" ]; then
            echo "No changes for ${AREA}."
            exit 0
          fi
          git config user.name "ver-sites publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Publish ${AREA} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push --quiet --force origin HEAD:main
          echo "### Published https://${DOMAIN}/" >> "$GITHUB_STEP_SUMMARY"
